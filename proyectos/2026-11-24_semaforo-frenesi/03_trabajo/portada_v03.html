<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fiesta del Semáforo · v03</title>
<style>
  @font-face { font-family: Unb; font-weight: 800; src: url(../02_assets/generados/fuentes/unbounded-latin-800-normal.woff2); }
  @font-face { font-family: Unb; font-weight: 900; src: url(../02_assets/generados/fuentes/unbounded-latin-900-normal.woff2); }
  @font-face { font-family: Bebas; src: url(../02_assets/generados/fuentes/bebas-neue-latin-400-normal.woff2); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
  .poster { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff; isolation: isolate; }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .glow  { mix-blend-mode: screen; }
  .grain { mix-blend-mode: overlay; opacity: .55; }

  /* ---- texto DETRÁS del semáforo ---- */
  .behind { position: absolute; left: 0; right: 0; text-align: center; }
  .t1 { position: absolute; top: 912px; font-family: Unb; font-weight: 800; font-size: 46px; letter-spacing: .3em; line-height: 1; color: rgba(255,255,255,.92); }
  .t1.l { left: 62px; } .t1.r { right: 62px; margin-right: -.3em; }
  .t2 { position: absolute; top: 972px; font-family: Unb; font-weight: 900; font-size: 160px; white-space: nowrap; letter-spacing: -.04em; line-height: 1; color: #fff;
        text-shadow: 0 0 40px rgba(255,255,255,.18); }
  .t2.l { right: calc(540px + var(--gap) / 2); } .t2.r { left: calc(540px + var(--gap) / 2); }
  .poster { --gap: 54px; }

  /* ---- delante ---- */
  .org { position: absolute; left: 0; right: 0; top: 30px; text-align: center; }
  .org img { width: 470px; filter: drop-shadow(0 0 20px rgba(165,60,255,.6)) drop-shadow(0 4px 10px rgba(0,0,0,.7)); }
  .org div { font-family: Bebas; font-size: 24px; letter-spacing: .7em; padding-left: .7em; opacity: .85; margin-top: -4px; }

  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: linear-gradient(0deg, rgba(0,0,0,.8), transparent); }
  .date { position: absolute; left: 62px; bottom: 54px; font-family: Unb; font-weight: 900; font-size: 84px; line-height: .9; letter-spacing: -.03em; }
  .date small { display: block; font-family: Bebas; font-weight: 400; font-size: 26px; letter-spacing: .45em; opacity: .8; margin-bottom: 10px; }
  .venue { position: absolute; right: 62px; bottom: 62px; text-align: right; }
  .venue small { display: block; font-family: Bebas; font-size: 26px; letter-spacing: .45em; margin-right: -.45em; opacity: .8; margin-bottom: 14px; }
  .venue img { width: 290px; display: block; filter: drop-shadow(0 0 14px rgba(230,227,3,.35)); }
</style>
</head>
<body>
<div class="poster">
  <img class="layer" src="../02_assets/generados/capas_v03/capa_fondo.png">
  <div class="t1 l">FIESTA</div><div class="t1 r">DEL</div>
  <div class="t2 l">SEMÁ</div><div class="t2 r">FORO</div>
  <img class="layer" src="../02_assets/generados/capas_v03/capa_frente.png">

  <div class="shade"></div>
  <div class="org"><img src="../02_assets/generados/logo-blendded_recorte.png" alt="Blendded"></div>
  <div class="date"><small>DICIEMBRE</small>21/12</div>
  <div class="venue"><small>EN</small><img src="../02_assets/generados/logo-frenesi_recorte.png" alt="Frenesí"></div>

  <img class="layer glow" src="../02_assets/generados/capas_v03/capa_brillo.png">
  <img class="layer grain" src="../02_assets/generados/capas_v03/capa_grano.png">
</div>
<script>
  // "SEMÁ | FORO": el poste pasa por el hueco central; cada mitad ocupa como mucho 436 px
  document.fonts.ready.then(() => {
    const parts = [...document.querySelectorAll(".t2")];
    const fs = parseFloat(getComputedStyle(parts[0]).fontSize);
    const maxW = Math.max(...parts.map(p => p.getBoundingClientRect().width));
    parts.forEach(p => p.style.fontSize = (fs * 448 / maxW) + "px");
  });
</script>
</body>
</html>
